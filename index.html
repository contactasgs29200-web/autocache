<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoCache Pro</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'%3E%3Cpolygon points='11,1 21,6 21,16 11,21 1,16 1,6' fill='%23f26522'/%3E%3Cpolygon points='11,5 17,8 17,14 11,17 5,14 5,8' fill='%23090909'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&family=Cormorant+Garamond:wght@600&family=Bebas+Neue&family=Montserrat:wght@700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
      /* ── Thème NUIT (palette de base, activée via data-theme="dark") ── */
      :root{
        --c-1c1c1c:#1c1c1c; --c-161616:#161616; --c-141414:#141414; --c-121212:#121212;
        --c-0e0e0e:#0e0e0e; --c-181818:#181818; --c-0a0a0a:#0a0a0a; --c-111:#111111;
        --c-2a2a2a:#2a2a2a; --c-252525:#252525; --c-222:#222222; --c-1e1e1e:#1e1e1e;
        --c-1a1a1a:#1a1a1a; --c-333:#333333; --c-282828:#282828; --c-3a1400:#3a1400;
        --c-e0dbd4:#e0dbd4; --c-ddd5c8:#ddd5c8; --c-ddd:#dddddd; --c-ccc:#cccccc;
        --c-bbb:#bbbbbb; --c-aaa:#aaaaaa; --c-9a9a9a:#9a9a9a; --c-888:#888888;
        --c-777:#777777; --c-666:#666666; --c-555:#555555; --c-4a4a4a:#4a4a4a; --c-444:#444444;
      }
      /* ── Thème JOUR (couleurs claires) ── */
      :root[data-theme="light"]{
        --c-1c1c1c:#efece6; --c-161616:#ffffff; --c-141414:#ffffff; --c-121212:#ece8e1;
        --c-0e0e0e:#e9e5dd; --c-181818:#efebe3; --c-0a0a0a:#e7e2d9; --c-111:#f6f3ed;
        --c-2a2a2a:#d9d2c6; --c-252525:#ddd6ca; --c-222:#dbd4c8; --c-1e1e1e:#e2dbcf;
        --c-1a1a1a:#e6dfd3; --c-333:#cdc4b6; --c-282828:#d3cbbd; --c-3a1400:#f2d8c3;
        --c-e0dbd4:#161310; --c-ddd5c8:#1f1c17; --c-ddd:#2e2924; --c-ccc:#3c372f; --c-bbb:#49433a;
        --c-aaa:#56504a; --c-9a9a9a:#595247; --c-888:#635c4f; --c-777:#6b6356;
        --c-666:#726a5b; --c-555:#797063; --c-4a4a4a:#7c7363; --c-444:#928a7a;
      }
      html,body{ background:var(--c-1c1c1c); }
    </style>
    <script>
      /* Applique le thème enregistré avant le premier rendu (évite un flash de couleur). Mode jour par défaut. */
      try { document.documentElement.setAttribute("data-theme", localStorage.getItem("ac_theme") || "light"); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
